spring:
  datasource:
    url: jdbc:mysql://localhost:3306/backend?serverTimezone=Asia/Shanghai&useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10

  output:
    ansi:
      enabled: always

mybatis:
    configuration:
      map-underscore-to-camel-case: true
    type-handlers-package: dreamcloud.backend.common.mybatis
