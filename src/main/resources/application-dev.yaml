spring:
  datasource:
    url: jdbc:sqlite:data/backEnd.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1

  output:
    ansi:
      enabled: always

mybatis:
    configuration:
      map-underscore-to-camel-case: true
    type-handlers-package: dreamcloud.backend.common.mybatis
