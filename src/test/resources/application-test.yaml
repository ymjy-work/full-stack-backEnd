spring:
  datasource:
    url: jdbc:h2:mem:backEnd;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: dreamcloud.backend.common.mybatis
